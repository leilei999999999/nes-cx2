name: Build NESNspire for TI-Nspire CX II

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tns.yml"
      - "scripts/**"
      - "*.zip"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Locate uploaded source archives
        id: archives
        shell: bash
        run: |
          NES_ZIP="$(find . -maxdepth 2 -type f -iname 'NesNspire*.zip' -print -quit)"
          MEDIA_ZIP="$(find . -maxdepth 2 -type f -iname 'Nspire-MediaPlayer*.zip' -print -quit)"
          test -n "$NES_ZIP" || { echo "NesNspire source ZIP not found"; exit 1; }
          test -n "$MEDIA_ZIP" || { echo "Nspire-MediaPlayer source ZIP not found"; exit 1; }
          echo "nes_zip=$NES_ZIP" >> "$GITHUB_OUTPUT"
          echo "media_zip=$MEDIA_ZIP" >> "$GITHUB_OUTPUT"

      - name: Prepare NESNspire with USB audio
        run: |
          python3 scripts/prepare-build.py \
            --nes-zip "${{ steps.archives.outputs.nes_zip }}" \
            --nmedia-zip "${{ steps.archives.outputs.media_zip }}" \
            --out build/NesNspire

      - name: Test generated source and Python scripts
        run: |
          python3 -m py_compile scripts/prepare-build.py scripts/verify-build.py scripts/make-audio-test-rom.py
          mkdir -p output
          python3 scripts/verify-build.py \
            --source-dir build/NesNspire \
            --report output/pre-build-verification.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl libgmp-dev libmpfr-dev libmpc-dev python3-dev php-cli libboost-program-options-dev zlib1g-dev

      - name: Checkout Ndless SDK
        uses: actions/checkout@v4
        with:
          repository: ndless-nspire/ndless
          path: ndless-sdk
          submodules: recursive
          fetch-depth: 0

      - name: Build ARM toolchain
        working-directory: ndless-sdk/ndless-sdk/toolchain
        run: ./build_toolchain.sh

      - name: Add Ndless tools to PATH
        run: |
          echo "$GITHUB_WORKSPACE/ndless-sdk/ndless-sdk/toolchain/install/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ndless-sdk/ndless-sdk/bin" >> "$GITHUB_PATH"

      - name: Build Ndless libraries and packaging tools
        shell: bash
        run: |
          SDK="$GITHUB_WORKSPACE/ndless-sdk/ndless-sdk"
          make -C "$SDK/libsyscalls" -j"$(nproc)"
          make -C "$SDK/libndls" -j"$(nproc)"
          make -C "$SDK/thirdparty" nspireio
          make -C "$SDK/tools/genzehn" -j"$(nproc)"
          # The compressed loader includes zlib.h from the vendored SDK submodule.
          sed -i 's|-I zlib/|-I zlib/ -I ../../thirdparty/zlib|' "$SDK/tools/zehn_loader/Makefile"
          make -C "$SDK/tools/zehn_loader" -j"$(nproc)"
          test -s "$SDK/tools/zehn_loader/zehn_loader.tns"
          test -s "$SDK/tools/zehn_loader/zehn_loader_compressed.tns"
          test -s "$SDK/lib/libsyscalls.a"
          test -s "$SDK/lib/libndls.a"
          test -s "$SDK/lib/libnspireio.a"
          test -x "$SDK/bin/genzehn"
          "$SDK/bin/genzehn" --help >/dev/null

      - name: Compile and package NESNspire
        working-directory: build/NesNspire
        run: |
          make clean
          make -j"$(nproc)"
          test -s NesNspire.elf
          test -s NesNspire.tns
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp NesNspire.tns "$GITHUB_WORKSPACE/output/NesNspire-CX2-USB-Audio.tns"
          cp -f InfoNES-log.tns "$GITHUB_WORKSPACE/output/" 2>/dev/null || true

      - name: Generate a known-good APU audio test ROM
        run: |
          python3 scripts/make-audio-test-rom.py \
            --output output/USB-Audio-Tone-Test.nes.tns

      - name: Verify linked executable, package, and audio test ROM
        run: |
          python3 scripts/verify-build.py \
            --source-dir build/NesNspire \
            --elf build/NesNspire/NesNspire.elf \
            --tns build/NesNspire/NesNspire.tns \
            --sdk-root "$GITHUB_WORKSPACE/ndless-sdk/ndless-sdk" \
            --test-rom output/USB-Audio-Tone-Test.nes.tns \
            --report output/verification-report.json
          sha256sum output/NesNspire-CX2-USB-Audio.tns output/USB-Audio-Tone-Test.nes.tns

      - name: Commit compiled TI-Nspire files
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p builds
          cp output/NesNspire-CX2-USB-Audio.tns builds/
          cp output/USB-Audio-Tone-Test.nes.tns builds/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/NesNspire-CX2-USB-Audio.tns builds/USB-Audio-Tone-Test.nes.tns
          if ! git diff --cached --quiet; then
            git commit -m "Build NESNspire and USB audio test ROM"
            git push
          fi

      - name: Upload TI-Nspire files and verification report
        uses: actions/upload-artifact@v4
        with:
          name: NesNspire-CX2-TNS
          path: |
            output/*.tns
            output/*verification.json
          if-no-files-found: error
          retention-days: 30
